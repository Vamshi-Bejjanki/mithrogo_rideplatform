[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
env =
    D:DJANGO_SECRET_KEY=test-only-secret-key-that-is-long-enough-for-hs256-signing
    D:DJANGO_DEBUG=1
    D:PAYMENT_WEBHOOK_SECRET=test-webhook-secret
    D:SQLITE_PATH=:memory:
    D:POSTGRES_DB=
    D:OTP_SEND_THROTTLE=1000/min
    D:OTP_VERIFY_THROTTLE=1000/min
addopts = -q
